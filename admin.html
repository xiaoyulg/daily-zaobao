<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>枣报管理 · 每日枣报</title>
<link rel="icon" href="assets/zao.svg" type="image/svg+xml">
<style>
:root {
  --bg: #faf9f6; --surface: #fff; --ink: #1c1a17; --ink-soft: #4a463f;
  --muted: #8a857b; --line: #e6e2d9; --accent: #9c2b25; --accent-soft: #f7ece9;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; line-height: 1.75; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }
header { border-bottom: 1px solid var(--line); background: rgba(250,249,246,.95); position: sticky; top: 0; z-index: 5; }
.header-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
.brand img { width: 30px; height: 30px; }
a { color: var(--accent); text-decoration: none; }
main { padding: 36px 0 80px; }
h1 { font-size: 24px; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 16px; margin: 0 0 16px; color: var(--accent); }
label { display: block; font-size: 13px; color: var(--ink-soft); margin: 12px 0 5px; }
input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; font-family: inherit; background: #fff; color: var(--ink); }
button { margin-top: 16px; padding: 9px 20px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
button:hover { opacity: .9; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin: 0; padding: 5px 12px; font-size: 12px; }
button.danger { background: #b23b3b; }
.msg { margin-top: 12px; font-size: 13px; color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.stat { flex: 1; min-width: 150px; background: var(--accent-soft); border-radius: 10px; padding: 14px 18px; }
.stat b { display: block; font-size: 26px; color: var(--accent); }
.stat span { font-size: 12px; color: var(--ink-soft); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.cmt-date { font-family: Georgia, serif; color: var(--accent); white-space: nowrap; }
.cmt-name { font-weight: 600; }
.cmt-time { color: var(--muted); font-size: 12px; margin-left: 8px; }
.cmt-text { white-space: pre-wrap; word-break: break-word; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.hidden { display: none; }
</style>
</head>
<body>
<header><div class="wrap header-inner">
  <div class="brand"><img src="assets/zao.svg" alt=""><span>每日枣报 · 管理</span></div>
  <a href="./">← 返回首页</a>
</div></header>

<main class="wrap">
  <h1>管理后台</h1>
  <p class="sub">设置密码后，可查看各期总浏览量与全部留言，并删除不当留言。密码只存在云端，请妥善保存。</p>

  <div id="setupView" class="card hidden">
    <h2>首次设置管理员密码</h2>
    <label for="setupPw">设置密码（至少 4 位）</label>
    <input type="password" id="setupPw" autocomplete="new-password">
    <label for="setupPw2">再输入一次</label>
    <input type="password" id="setupPw2" autocomplete="new-password">
    <button id="setupBtn">设置密码</button>
    <div class="msg" id="setupMsg"></div>
    <p class="hint">此操作仅限首次，设置后无法在此页面修改。忘记密码需通过云端重置。</p>
  </div>

  <div id="loginView" class="card hidden">
    <h2>登录</h2>
    <label for="loginPw">管理员密码</label>
    <input type="password" id="loginPw" autocomplete="current-password">
    <button id="loginBtn">登录</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="dashView" class="hidden">
    <div class="stats">
      <div class="stat"><b id="statIssues">—</b><span>有浏览记录的期数</span></div>
      <div class="stat"><b id="statViews">—</b><span>累计浏览量</span></div>
      <div class="stat"><b id="statComments">—</b><span>留言总数</span></div>
    </div>
    <div class="card">
      <h2>各期浏览量</h2>
      <div id="viewsBox"></div>
    </div>
    <div class="card">
      <h2>全部留言</h2>
      <div id="commentsBox"></div>
    </div>
    <button class="ghost" id="refreshBtn">刷新数据</button>
    <button class="ghost" id="logoutBtn" style="margin-left:8px">退出登录</button>
  </div>
</main>

<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'zaobao:admin:token';
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function token() {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }
  function setToken(t) {
    try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }
  function req(path, options) {
    options = options || {};
    options.headers = options.headers || {};
    if (token()) options.headers.Authorization = 'Bearer ' + token();
    return fetch(path, options).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, data: d }; });
    });
  }
  function show(view) {
    ['setupView', 'loginView', 'dashView'].forEach(function (id) {
      document.getElementById(id).classList.toggle('hidden', id !== view);
    });
  }

  req('api/admin/status').then(function (res) {
    if (token()) {
      req('api/admin/data').then(function (r) { r.ok ? render(r.data) : (setToken(''), show('loginView')); })
        .catch(function () { show('loginView'); });
    } else {
      show(res.data.setup ? 'loginView' : 'setupView');
    }
  }).catch(function () { show('loginView'); });

  document.getElementById('setupBtn').addEventListener('click', function () {
    var p1 = document.getElementById('setupPw').value;
    var p2 = document.getElementById('setupPw2').value;
    var msg = document.getElementById('setupMsg');
    if (p1.length < 4) { msg.textContent = '密码至少 4 位'; return; }
    if (p1 !== p2) { msg.textContent = '两次输入不一致'; return; }
    req('api/admin/setup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: p1 })
    }).then(function (res) {
      if (res.ok) { msg.textContent = '设置成功，请登录'; show('loginView'); }
      else { msg.textContent = res.data.error || '设置失败'; }
    }).catch(function () { msg.textContent = '网络错误'; });
  });

  document.getElementById('loginBtn').addEventListener('click', function () {
    var pw = document.getElementById('loginPw').value;
    var msg = document.getElementById('loginMsg');
    req('api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    }).then(function (res) {
      if (res.ok && res.data.token) {
        setToken(res.data.token);
        return req('api/admin/data').then(function (r) { if (r.ok) render(r.data); });
      }
      msg.textContent = res.data.error || '登录失败';
    }).catch(function () { msg.textContent = '网络错误'; });
  });

  document.getElementById('refreshBtn').addEventListener('click', function () {
    req('api/admin/data').then(function (r) { if (r.ok) render(r.data); else { setToken(''); show('loginView'); } });
  });
  document.getElementById('logoutBtn').addEventListener('click', function () {
    setToken(''); show('loginView');
  });

  function render(data) {
    var views = data.views || [], comments = data.comments || [];
    var totalViews = views.reduce(function (a, v) { return a + (v.count || 0); }, 0);
    var totalComments = comments.reduce(function (a, c) { return a + (c.list ? c.list.length : 0); }, 0);
    document.getElementById('statIssues').textContent = views.length;
    document.getElementById('statViews').textContent = totalViews;
    document.getElementById('statComments').textContent = totalComments;

    var vb = document.getElementById('viewsBox');
    if (!views.length) { vb.innerHTML = '<div class="empty">暂无浏览记录</div>'; }
    else {
      var h = '<table><thead><tr><th>日期</th><th>浏览量</th></tr></thead><tbody>';
      views.forEach(function (v) { h += '<tr><td class="cmt-date">' + esc(v.date) + '</td><td>' + esc(v.count) + '</td></tr>'; });
      h += '</tbody></table>';
      vb.innerHTML = h;
    }

    var cb = document.getElementById('commentsBox');
    if (!comments.length) { cb.innerHTML = '<div class="empty">暂无留言</div>'; }
    else {
      var html = '';
      comments.forEach(function (g) {
        html += '<div style="margin-bottom:18px"><div class="cmt-date">' + esc(g.date) + ' · ' + (g.list ? g.list.length : 0) + ' 条</div>';
        (g.list || []).slice().reverse().forEach(function (c) {
          html += '<div style="padding:12px 0;border-bottom:1px solid var(--line)">';
          html += '<div><span class="cmt-name">' + esc(c.name) + '</span><span class="cmt-time">' + esc(c.time) + '</span> ';
          html += '<button class="ghost danger" data-date="' + esc(g.date) + '" data-id="' + esc(c.id) + '">删除</button></div>';
          html += '<div class="cmt-text">' + esc(c.text) + '</div></div>';
        });
        html += '</div>';
      });
      cb.innerHTML = html;
      Array.prototype.forEach.call(cb.querySelectorAll('button[data-id]'), function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('确定删除这条留言？')) return;
          req('api/admin/delete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: btn.getAttribute('data-date'), id: btn.getAttribute('data-id') })
          }).then(function (r) { if (r.ok) render(data); else alert('删除失败'); });
        });
      });
    }
    show('dashView');
  }
})();
</script>
</body>
</html>
